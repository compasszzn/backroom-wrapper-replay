# backroom-wrapper-replay 的配置。run.sh 读它；bot 的默认值也来自这里。
# 这个包围绕同级目录的 Backroom-Wrapper 工作：游戏与 harness 全部复用它，
# 这里只放「内挂怎么跑、录什么、随机固定成什么」。
#
# 策略放 strategies/ 下，一个策略一个文件夹（bot 代码 + README + recordings + logs）：
#   strategies/01-grab-one-page/      固定种子找到 1 张日记页即成功
#   strategies/02-full-clear-escape/  固定种子收齐 8 页 + 4 瓶杏仁水 + 推门逃脱
#   ./run.sh --strategy <目录名> 选择策略。

# 被 wrapper 化的游戏包（提供 modeB/harness、adapters、game/ 静态产物）。
WRAPPER_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)/Backroom-Wrapper"

# ── 固定随机 ─────────────────────────────────────────────────────────────
# 每局用这粒种子开局（harness reset(seed=) 换局，迷宫/8 张页/4 瓶水/出口门/
# 实体初始位置全部由它决定，mulberry32 同种子必同图）。
SEED=1234

# ── 策略 01 的目标 ───────────────────────────────────────────────────────
# 找到一页纸（收集 1 张日记页即成功）。可改大，但 8 张全收会唤醒实体进入追逐，
# 多页需求请用策略 02（它有完整的实体规避）。
PAGES_GOAL=1

# ── 录制 ─────────────────────────────────────────────────────────────────
# MP4 录制帧率（X11 抓帧 → ffmpeg 管线）。30 是 harness 录制面板的默认档。
REC_FPS=30

# ── 护栏（按策略）───────────────────────────────────────────────────────
# 各策略一局的游戏墙钟预算（秒）。超时判负、照常收录制，防止无人值守卡死。
# 01 只找 1 页，240s 足够；02 要收齐 12 个物资点并躲实体跑全程，给 900s。
MAX_SECONDS_01=240
MAX_SECONDS_02=900

# 游戏从启动到可以接受输入的上限（秒），透传给 harness；慢机器可调大。
READY_TIMEOUT=300
